default_language_version:
  python: python3.12
repos:
  - repo: https://github.com/ministryofjustice/devsecops-hooks
    rev: v1.3.0
    hooks:
      - id: baseline
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.9
    hooks:
      # Run the linter.
      - id: ruff-check
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/jazzband/pip-tools
    rev: 7.3.0
    hooks:
      - id: pip-compile
        language_version: python3.12
        name: pip-compile requirements.in
        files: requirements(|lint).in
        args:
          [
            requirements/source/requirements.in,
            "--output-file",
            requirements/generated/requirements.txt,
          ]
      - id: pip-compile
        language_version: python3.12
        name: pip-compile requirements-linting.in
        files: requirements(|-lint).in
        args:
          [
            requirements/source/requirements-linting.in,
            "--output-file",
            requirements/generated/requirements-linting.txt,
          ]
